log4j.rootLogger=WARN, STDOUT, WEBSOCKET
log4j.logger.com.jayway.jsonpath.internal.path=OFF
log4j.logger.com.jayway.jsonpath.internal.filter=OFF
log4j.appender.STDOUT=org.apache.log4j.ConsoleAppender
log4j.appender.STDOUT.layout=org.apache.log4j.PatternLayout
log4j.appender.STDOUT.layout.ConversionPattern=%-5p %c{1}:%L - %m%n
log4j.appender.WEBSOCKET=fr.mines_stetienne.ci.sparql_generate.api.StringWriterAppender
log4j.appender.WEBSOCKET.layout=org.apache.log4j.PatternLayout
log4j.appender.WEBSOCKET.layout.ConversionPattern=%-5p %d{HH:mm:ss,SSS} - %t:%C{1}:%L - %m%n
