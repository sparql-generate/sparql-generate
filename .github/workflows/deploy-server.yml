name: Deploy the playground server

# Rebuilds a released version and updates ci.mines-stetienne.fr (API docs, server WAR,
# restart), without publishing anything to Maven Central or GitHub releases. Use it when the
# last steps of the Release workflow failed, or to redeploy an earlier version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy, e.g. v2.2.0"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the WAR and the API docs
        run: mvn -B package -P docs -DskipTests --file sparql-generate-parent/pom.xml

      - name: Upload the API docs to ci.mines-stetienne.fr
        uses: appleboy/scp-action@v0.1.7
        with:
          source: "sparql-generate-all/target/reports/apidocs"
          target: "~/website"
          strip_components: 3
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}

      - name: Upload the server WAR to ci.mines-stetienne.fr
        uses: appleboy/scp-action@v0.1.7
        with:
          source: "sparql-generate-server/target/sparql-generate.war"
          target: "~"
          strip_components: 2
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}

      - name: Restart the playground server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}
          script: sudo ./update-app
