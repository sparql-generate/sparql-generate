name: Release

# Pushing a tag vX.Y.Z publishes version X.Y.Z:
#   1. to Maven Central, through the Central Portal (central-publishing-maven-plugin),
#      unless X.Y.Z ends with -SNAPSHOT (snapshot.sh): then only a GitHub pre-release;
#   2. as a GitHub release, with the command-line JAR and the javadoc;
#   3. on ci.mines-stetienne.fr (API docs and the playground server). These last steps may
#      fail without failing the release: the server's SSH port is not reachable from
#      GitHub-hosted runners (i/o timeout since 2026-11); deploy by hand then.
# The version in the POMs must already be X.Y.Z (see release.sh).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17, Central Portal credentials and GPG key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check that the tag matches the POM version
        id: vars
        run: |
          version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec --file sparql-generate-parent/pom.xml)
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match POM version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)          echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build, sign and publish to Maven Central
        if: steps.vars.outputs.prerelease == 'false'
        run: mvn -B deploy -P deploy --file sparql-generate-parent/pom.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build a snapshot (not published to Maven Central)
        if: steps.vars.outputs.prerelease == 'true'
        run: mvn -B package -P docs --file sparql-generate-parent/pom.xml

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          cp sparql-generate-all/target/sparql-generate.jar sparql-generate-$VERSION.jar
          cp sparql-generate-all/target/sparql-generate-all-$VERSION-javadoc.jar sparql-generate-$VERSION-javadoc.jar
          flags="--verify-tag --generate-notes"
          [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          gh release create "$GITHUB_REF_NAME" --title "$VERSION" $flags \
            sparql-generate-$VERSION.jar sparql-generate-$VERSION-javadoc.jar

      - name: Upload the API docs to ci.mines-stetienne.fr
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          source: "sparql-generate-all/target/reports/apidocs"
          target: "~/website"
          strip_components: 3
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}

      - name: Upload the server WAR to ci.mines-stetienne.fr
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          source: "sparql-generate-server/target/sparql-generate.war"
          target: "~"
          strip_components: 2
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}

      - name: Restart the playground server
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ci.mines-stetienne.fr
          username: ${{ secrets.CI_USER }}
          key: ${{ secrets.CI_KEY }}
          script: sudo ./update-app
