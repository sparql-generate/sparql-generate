name: Website build

on:
  push:
    paths:
      - sparql-generate-website/**
    branches:
      - '**'
  pull_request:
    paths:
      - sparql-generate-website/**

# Builds and tests the static website. It is deployed from the maintainer's machine
# with ./update-app.sh build push, not from CI.

jobs:
  build-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test and build the website
        run: |
          npm ci
          npm test
          npm run build
        working-directory: sparql-generate-website
